# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Herzog–Schönheim conjecture for solvable groups"
  description: >-
    A Lean 4 formalization of the Herzog–Schönheim conjecture (Erdős problem 274)
    for every solvable group, finite or infinite: if a solvable group is
    partitioned into finitely many, and at least two, left cosets of subgroups,
    then two of the subgroups have the same index (hence, in the cardinality
    form, the same cardinality). The conjecture for arbitrary groups is open and
    is not claimed. The infinite case reduces to a finite solvable quotient by
    the common core of the parts; the finite case is proved for a least
    counterexample by considering its largest prime divisor p, using the
    subgroup generated by the p-prime-part elements, divisibility restrictions
    on local indices obtained from fixed-point counts in a primitive solvable
    quotient, and an extra closure argument at p = 7. The statements use the
    same exact covering structure as the formal-conjectures file for Erdős
    problem 274.
  authors:
    - "Murali Menon"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Murali Menon"

classification:
  arxiv:
    - "math.GR"
    - "math.CO"
  msc2020:
    - "20D60"
    - "20D10"
    - "05B40"

sources:
  - title: "The Herzog–Schönheim conjecture for solvable groups"
    authors:
      - "Murali Menon"
    type: "original-proof"
    relationship: "other"
    note: >-
      The proof is original to this development and was found and formalized
      together with AI assistants. No published prior proof of the solvable
      case is known to the maintainer: a literature search on 2026-09-24
      (arXiv, zbMATH, erdosproblems.com, web) found none. The only claim,
      M. C. Burkhart, arXiv:1901.10131v1 (2019), was withdrawn in v2 because
      of a gap in its Lemma 1. Novelty has not been confirmed by MathSciNet or
      by a specialist; treat it as unknown rather than established.
  - title: "Group partition, factorization and the vector covering problem"
    authors:
      - "Marcel Herzog"
      - "Jochanan Schönheim"
    type: "paper"
    id: "Canad. Math. Bull. 15 (1972)"
    relationship: "background"
    note: "Source of the conjecture; it is open for arbitrary groups."
  - title: "Groups covered by finitely many cosets"
    authors:
      - "B. H. Neumann"
    type: "paper"
    id: "Publ. Math. Debrecen 3 (1954) 227–242"
    relationship: "background"
    note: >-
      Neumann's lemma (a finite coset cover has a part of finite index, hence
      every part of an exact covering has finite index) is used through
      Mathlib's `Subgroup.leftCoset_cover_filter_FiniteIndex` to reduce infinite
      groups to finite quotients.
  - title: "Z.-W. Sun, uniform covers and bounds on unions of cosets"
    authors:
      - "Zhi-Wei Sun"
    type: "paper"
    id: "arXiv:math/0306099"
    relationship: "background"
    note: >-
      Sun's bound on unions of cosets of subgroups, applied in a quotient, is an
      ingredient of the finite argument; it is re-proved in this development.
  - title: "Erdős problem 274"
    type: "web discussion"
    id: "https://www.erdosproblems.com/274"
    location: "FormalConjectures/ErdosProblems/274.lean in github.com/google-deepmind/formal-conjectures"
    relationship: "background"
    note: >-
      The statements are in the exact shape of the formal-conjectures file for
      this problem, with `[Group.IsSolvable G]` added.

related_formalizations:
  - id: "google-deepmind/formal-conjectures:FormalConjectures/ErdosProblems/274.lean"
    relationship: "other"
    note: >-
      Statement-only file (with `sorry`) for the general conjecture. The
      `Group.ExactCovering` structure here is copied from it field for field;
      this repository proves the solvable case, not the general one.

status:
  scope: >-
    The Comparator claim is the Herzog–Schönheim conjecture for every solvable
    group (finite or infinite): index form, cardinality form, and cardinality
    form for finite groups. It does not claim the conjecture for arbitrary
    groups. The hypothesis `1 < ENat.card G` is kept, unused, to match the
    upstream statement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Erdos274.Palomar.herzog_schonheim_solvable"
      file: "Challenge.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Erdos274.Palomar.erdos_274_solvable"
      file: "Challenge.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Erdos274.Palomar.erdos_274_solvable_fintype"
      file: "Challenge.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      framework: "Claude Code"
      models: ["Claude Fable 5", "Claude Opus 5", "Claude Opus 5.5", "Claude Sonnet 5.5"]
      tool_setup: >-
        Agentic terminal sessions wrote and repaired most of the Lean
        development and the paper, ran builds, and checked axioms. The
        Co-Authored-By trailers in the git history record which model took part.
    - method: "agent"
      framework: "OpenAI Codex"
      models: ["GPT-6-Luna", "GPT-5.6 Sol"]
      tool_setup: >-
        Contributed to the cyclotomic divisibility route and to review; recorded
        in the git history trailers.
    - method: "manual"
      tool_setup: "Problem selection, direction of the work, and acceptance of results by the maintainer."
  spend_usd: "not tracked"
  notes: >-
    Prompts and session logs were not retained. The history of this repository
    was filtered to the import closure of the head theorem, so early commits
    may not build on their own; the tip does.

fidelity:
  divergences: >-
    The Challenge restates the upstream `Erdos274.Group.ExactCovering`
    structure verbatim (same field names, types and order) rather than
    importing it, so that the Challenge needs only Mathlib. The three compared
    theorems have the hypotheses and conclusions of upstream `herzog_schonheim`
    and `erdos_274` plus `[Group.IsSolvable G]`; the unused `hG` hypothesis is
    kept to match upstream. The accompanying paper is not bundled in this
    repository.

review:
  status: "agent-reviewed"
  reviewers:
    - "GPT-5.6 Sol (paper review)"
    - "Qwen3.8-Max (paper review)"
  notes: >-
    The informal paper was reviewed by AI systems; the Lean proof is
    machine-checked. No independent human mathematical review (MathSciNet or a
    specialist) has been done. Fidelity of the Lean statements to the informal
    conjecture is argued in `Challenge.lean` and `README.md`.

alignment:
  namespace: "Erdos274.Palomar"
  statements:
    - source: "Herzog–Schönheim conjecture, solvable case (index form)"
      lean: "Erdos274.Palomar.herzog_schonheim_solvable"
      module: "Challenge.lean and Solution.lean"
      status: "proved"
    - source: "Erdős problem 274, solvable case (cardinality form)"
      lean: "Erdos274.Palomar.erdos_274_solvable"
      module: "Challenge.lean and Solution.lean"
      status: "proved"
    - source: "Erdős problem 274, finite solvable case (cardinality form)"
      lean: "Erdos274.Palomar.erdos_274_solvable_fintype"
      module: "Challenge.lean and Solution.lean"
      status: "proved"

acknowledgements: >-
  The development uses Lean 4 and Mathlib. AI systems (Claude, OpenAI Codex)
  contributed to the formalization and its review.
